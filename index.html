<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1c3d32" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<title>読みきかせ / Read Aloud</title>
  <script type="module" crossorigin src="./assets/index-DLC6ry5e.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BPkS3uUW.css">
<link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
<body>
<header class="top">
  <h1 data-t="app"></h1>
  <div class="switches">
    <button id="big" class="chip" aria-pressed="false" data-t="big"></button>
    <button id="lang" class="chip" lang="en">English</button>
  </div>
</header>
<main>
  <p class="lead" data-t="lead"></p>
  <div class="row">
    <button id="paste" class="btn" data-t="paste"></button>
    <label class="btn" for="pdf"><span data-t="pdf"></span></label>
    <input id="pdf" type="file" accept="application/pdf,.pdf,text/plain,.txt" hidden />
    <button id="edit" class="btn" data-t="edit" hidden></button>
    <button id="wipe" class="btn" data-t="wipe"></button>
  </div>
  <div id="msg" class="msg" hidden></div>
  <textarea id="text" rows="10"></textarea>
  <div id="reader" class="reader" hidden></div>

  <div class="player">
    <button id="play" class="primary" data-t="play"></button>
    <button id="stop" class="btn" data-t="stop"></button>
  </div>
  <div class="row settings">
    <label><span data-t="speed"></span> <b id="rateVal">1.0</b>
      <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1" /></label>
    <label><span data-t="voice"></span>
      <select id="voice"></select></label>
  </div>
  <p class="note" data-t="note"></p>
</main>
</body>
</html>
